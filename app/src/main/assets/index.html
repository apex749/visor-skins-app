function parseFrames(dv,fc){

function parseIFP(buf){

$('#bi').onclick=()=>$('#wpn').classList.remove('on')||anims.length?$('#anp').classList.toggle('on'):$('#ii').click();
$('#ao').onclick=()=>$('#ii').click();
$('#bz').onclick=()=>pick(-1);
$('#ax').onclick=()=>$('#anp').classList.remove('on');
$('#ap').onclick=()=>{if(!anim)return;playing=!playing;$('#ap').textContent=playing?'Pausar':'Reproducir';if(playing)play()};
$('#ac').onclick=()=>{CONJ=!CONJ;$('#ac').textContent='Giro: '+(CONJ?'invertido':'normal');draw()};
$('#ii').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    anims=parseIFP(await f.arrayBuffer());anim=null;playing=false;animT=0;
    $('#bi').textContent='Anim';fillAnims();$('#anp').classList.add('on');
    msg(f.name+': '+anims.length+' animaciones');log('IFP '+f.name+': '+anims.length+' animaciones');draw();
  }catch(err){msg('Error al leer el IFP: '+err.message);log('IFP ERROR: '+err.message)}
};

function drawWeapon(){
  if(!weapon.length||!skel||!gPV)return;
  const H=handMat();if(!H)return;
  const d=Math.PI/180,O=mul(T(woff.x,woff.y,woff.z),mul(Rx(woff.rx*d),mul(Ry(woff.ry*d),Rz(woff.rz*d)))),MW=mul(H,O);
  gl.uniform1f(U('sk'),0);gl.disableVertexAttribArray(3);gl.disableVertexAttribArray(4);
  for(const o of weapon){
    const M=mul(MW,o.fm),RR=mul(gR,M);
    gl.uniformMatrix4fv(U('mvp'),false,mul(gPV,M));
    gl.uniformMatrix3fv(U('nm'),false,new Float32Array([RR[0],RR[1],RR[2],RR[4],RR[5],RR[6],RR[8],RR[9],RR[10]]));
    gl.bindBuffer(gl.ARRAY_BUFFER,o.pb);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,o.nb);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,o.tb);gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,2,gl.FLOAT,false,0,0);
    for(const p of o.parts){
      gl.uniform4fv(U('col'),p.col);gl.uniform1f(U('ht'),p.tex?1:0);
      if(p.tex)gl.bindTexture(gl.TEXTURE_2D,p.tex);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,p.ib);gl.drawElements(gl.TRIANGLES,p.n,o.big?gl.UNSIGNED_INT:gl.UNSIGNED_SHORT,0);
    }
  }
}
function render(){renderScene();drawWeapon()}
function handMat(){
  if(!skel)return null;
  const i=skel.bones.findIndex(b=>b.id==wbone);if(i<0)return null;
  return(anim&&skel.ok&&lastW[i])?lastW[i]:skel.bones[i].wb;
}
function freeW(){wres.forEach(b=>gl.deleteBuffer(b));wtx.forEach(t=>gl.deleteTexture(t));weapon=[];wres=[];wtx=[]}
function uploadWeapon(geos,txd){
  freeW();
  for(const g of geos){
    const mk=(t,d)=>{const b=gl.createBuffer();gl.bindBuffer(t,b);gl.bufferData(t,d,gl.STATIC_DRAW);wres.push(b);return b};
    const big=g.nv>65535&&u32,o={pb:mk(gl.ARRAY_BUFFER,g.pos),nb:mk(gl.ARRAY_BUFFER,g.nrm),tb:mk(gl.ARRAY_BUFFER,g.uv),parts:[],big,fm:g.fm||ID};
    for(const [m,idx] of g.groups){
      const mat=g.mats[m]||{},t=mat.tex&&txd[mat.tex];
      log('  arma mat '+m+' tex='+(mat.tex||'ninguna')+(mat.tex&&!t?' NO ESTA EN EL TXD':'')+' tris='+idx.length/3);
      o.parts.push({ib:mk(gl.ELEMENT_ARRAY_BUFFER,big?new Uint32Array(idx):new Uint16Array(idx)),n:idx.length,col:mat.col||[1,1,1,1],tex:t?mkTex(t,wtx):null});
    }
    weapon.push(o);
  }
}
const WP=[['X','x',.01],['Y','y',.01],['Z','z',.01],['Giro X','rx',5],['Giro Y','ry',5],['Giro Z','rz',5]];
function saveW(){try{localStorage.setItem('woffs:'+wfile,JSON.stringify(woffs))}catch(e){}}
function swapW(k){woffs[wkey]=woff;woff=woffs[k]||Object.assign({},woff);woffs[k]=woff;wkey=k;fillW();saveW()}
function fillW(){
  const g=$('#wg');g.textContent='';
  const h=document.createElement('div');h.textContent='Ajuste para: '+wkey+' (se guarda por animación)';g.appendChild(h);
  for(const [lb,k,st] of WP){
    const r=document.createElement('div'),sp=document.createElement('span'),v=document.createElement('b'),m=document.createElement('button'),pl=document.createElement('button');
    sp.textContent=lb;m.textContent='−';pl.textContent='+';
    const upd=()=>{v.textContent=woff[k].toFixed(k[0]=='r'?0:2)};upd();
    m.onclick=()=>{woff[k]=+(woff[k]-st*wstep).toFixed(3);upd();saveW();draw()};
    pl.onclick=()=>{woff[k]=+(woff[k]+st*wstep).toFixed(3);upd();saveW();draw()};
    r.append(sp,m,v,pl);g.appendChild(r);
  }
}
$('#bt').onclick=()=>{const m=$('#fm');m.classList.toggle('on');$('#bt').textContent=m.classList.contains('on')?'Cerrar menú':'Menú'};
$('#fm').addEventListener('click',e=>{if(e.target.tagName=='BUTTON'&&e.target.id!='bf2'){$('#fm').classList.remove('on');$('#bt').textContent='Menú'}});
$('#bf2').onclick=()=>{RGRIS=!RGRIS;$('#bf2').textContent='Fondo render: '+(RGRIS?'#383838':'transparente')};
$('#ay').oninput=e=>{aimY=+e.target.value;draw()};
$('#ap2').oninput=e=>{aimP=+e.target.value;draw()};
$('#bw').onclick=()=>{
  if(!weapon.length){$('#wi').click();return}
  $('#anp').classList.remove('on');$('#wpn').classList.toggle('on');
};

$('#wx').onclick=()=>$('#wpn').classList.remove('on');
$('#wq').onclick=()=>{freeW();$('#wpn').classList.remove('on');msg('Arma quitada');draw()};
$('#wr').onclick=()=>{Object.assign(woff,{x:0,y:0,z:0,rx:0,ry:0,rz:0});fillW();saveW();draw()};
$('#wb').onclick=()=>{wbone=wbone==24?34:24;$('#wb').textContent='Mano: '+(wbone==24?'der':'izq');draw()};
$('#wp').onclick=()=>{wstep=wstep==1?5:1;$('#wp').textContent='Paso x'+wstep};
$('#wi').onchange=async e=>{
  const fs=[...e.target.files];e.target.value='';
  const df=fs.find(f=>/\.dff$/i.test(f.name)),tf=fs.find(f=>/\.txd$/i.test(f.name));
  if(!df){msg('Elige el .dff del arma junto con su .txd');return}
  try{
    log('--- ARMA '+df.name+' ---');
    const geos=parseDFF(await df.arrayBuffer()),txd=tf?parseTXD(await tf.arrayBuffer()):{};
    await fillShared(geos,txd,tf,-1);
    const F=geos.frames||[],W=[];F.forEach((f,i)=>{W[i]=f.par>=0&&W[f.par]?mul(W[f.par],f.m):f.m});
    (geos.atomics||[]).forEach(a=>{if(geos[a.g]&&W[a.f])geos[a.g].fm=W[a.f]});
    wfile=df.name;wkey=anim?anim.name:'base';
    try{woffs=JSON.parse(localStorage.getItem('woffs:'+wfile)||'{}')}catch(e){woffs={}}
    woff=woffs[wkey]||{x:0,y:0,z:0,rx:0,ry:0,rz:0};woffs[wkey]=woff;
    uploadWeapon(geos,txd);fillW();
    log('Arma: '+geos.length+' geometrías, '+geos.reduce((n,g)=>n+g.nv,0)+' vértices, TXD='+(tf?tf.name:'ninguno'));
    msg(skel?df.name+' cargada. Ajusta posición y giro en el panel Arma':'Carga un skin con esqueleto para ver el arma');
    $('#anp').classList.remove('on');$('#wpn').classList.add('on');draw();
  }catch(err){msg('Error con el arma: '+err.message);log('ARMA ERROR: '+err.message)}
};
$('#br').onclick=snapshot;
$('#bg').onclick=()=>$('#logp').classList.add('on');$('#lx').onclick=()=>$('#logp').classList.remove('on');
$('#lc').onclick=()=>{const t=$('#lt');t.focus();t.select();document.execCommand('copy');$('#lc').textContent='Copiado';setTimeout(()=>$('#lc').textContent='Copiar',1500)};
render();
